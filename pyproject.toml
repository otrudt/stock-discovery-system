[project]
name = "stock-discovery-system"
version = "0.1.0"
description = "Point-in-time stock discovery: validate signals before they rank anything."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "pytz>=2026.5",
]

[project.scripts]
sds = "sds.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Specs and plans hold code fragments (function bodies, excerpts), not modules.
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sds"]
mypy_path = "src"
